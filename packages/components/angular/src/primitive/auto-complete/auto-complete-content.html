<fex-popover-content
  [class]="contentClass"
  [style.width]="'var(--auto-complete-content-width,var(--floating-reference-width))'"
  [style.max-width]="'var(--auto-complete-content-width,var(--floating-reference-width))'"
  [style.max-height]="'min(var(--floating-available-height,calc(100vh - 16px)),var(--auto-complete-content-max-height,320px))'"
