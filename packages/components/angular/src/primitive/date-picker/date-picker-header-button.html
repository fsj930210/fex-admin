@if (isDouble()) {
  @if (isPrevious()) {
    <fex-chevron-left-icon />
    <fex-chevron-left-icon [class]="doubleIconClassName" />
  } @else {
    <fex-chevron-right-icon />
    <fex-chevron-right-icon [class]="doubleIconClassName" />
  }
} @else {
  @if (isPrevious()) {
    <fex-chevron-left-icon />
  } @else {
    <fex-chevron-right-icon />
  }
}
