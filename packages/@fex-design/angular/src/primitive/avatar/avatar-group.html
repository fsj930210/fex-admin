<ng-content />
@if (overflowCount() > 0) {
  @if (overflow(); as overflowTemplate) {
    <ng-container *ngTemplateOutlet="overflowTemplate; context: { $implicit: overflowCount(), items: overflowItems() }" />
  } @else {
    <span data-slot="avatar-group-overflow" [class]="overflowClassName">+{{ overflowCount() }}</span>
  }
}
