@for (value of visibleValues(); track label(value)) {
<fex-tag data-slot="date-picker-tag" size="sm" closable (pointerdown)="$event.stopPropagation()" (close)="remove(value, $event)">{{ label(value) }}</fex-tag>
} @if (overflowCount() > 0) {
<fex-tag data-slot="date-picker-tag-overflow" size="sm">+{{ overflowCount() }}</fex-tag>
}
