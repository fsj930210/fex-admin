<ng-content />
@if (closable()) {
  <button type="button" data-slot="tag-close" [attr.aria-label]="closeLabel()" [disabled]="disabled()" [class]="closeClassName" (click)="close.emit($event)">
    @if (projectedCloseIcon()) {
      <ng-content select="[fexTagCloseIcon]" />
    } @else {
      <fex-close-icon aria-hidden="true" />
    }
  </button>
}
