<fex-card title="Instance methods" description="The exported directive exposes methods for this Collapse instance.">
  <div class="mb-space-md flex flex-wrap gap-space-sm">
    <button fexButton variant="outline" size="sm" (click)="collapse.expand('security')">Open security</button>
    <button fexButton variant="outline" size="sm" (click)="collapse.toggle('billing')">Toggle billing</button>
    <button fexButton variant="ghost" size="sm" (click)="collapse.clear()">Clear</button>
  </div>
  <div fexCollapse #collapse="fexCollapse" [defaultExpandedKeys]="['profile']">
    @for (item of items; track item.value) {
      <div [fexCollapseItem]="item.value">
        <button fexCollapseTrigger>
          <span class="min-w-0 flex-1">{{ item.title }}</span>
          <fex-chevron-right-icon class="size-4 shrink-0 text-muted-foreground transition-transform duration-200 group-data-[state=open]/collapse-trigger:-rotate-90" />
        </button>
        <div fexCollapseContent>{{ item.content }}</div>
      </div>
    }
  </div>
</fex-card>
