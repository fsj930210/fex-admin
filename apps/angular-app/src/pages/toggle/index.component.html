<main class="min-h-screen bg-secondary-background px-page-padding py-space-xl">
  <div class="mx-auto w-full max-w-5xl space-y-space-xl">
    <header class="space-y-space-xl">
      <a class="text-sm text-muted-foreground hover:text-foreground" routerLink="/">Back home</a>
      <div><h1 class="text-2xl font-semibold text-foreground">Toggle</h1><p class="mt-space-md text-sm text-muted-foreground">Two-state controls for independent actions and related option groups.</p></div>
    </header>
    <div class="grid gap-space-xl">
      <fex-card title="Standalone" description="A single Toggle exposes a clear pressed state without needing a group.">
        <div class="grid justify-items-start gap-space-md"><button fexToggle [pressed]="pressed()" (change)="pressed.set($event)"><span aria-hidden="true">★</span>Favorite</button><p class="text-sm text-muted-foreground">{{ pressed() ? 'Added to favorites' : 'Not in favorites' }}</p></div>
      </fex-card>
      <fex-card title="Single selection" description="The group reads as one segmented control while keeping each option independently focusable.">
        <div class="grid gap-space-md"><div fexToggleGroup [value]="alignment()" aria-label="Text alignment" (change)="setSingle($event)"><button fexToggle value="left">Left</button><button fexToggle value="center">Center</button><button fexToggle value="right">Right</button></div><p class="text-sm text-muted-foreground">Alignment: {{ alignment() || 'none' }}</p></div>
      </fex-card>
      <fex-card title="Multiple selection" description="Multiple mode keeps related formatting controls inside one visual surface.">
        <div class="grid gap-space-md"><div fexToggleGroup multiple [value]="formats()" aria-label="Text formatting" (change)="setMultiple($event)"><button fexToggle value="bold"><strong aria-hidden="true">B</strong>Bold</button><button fexToggle value="italic"><em aria-hidden="true">I</em>Italic</button><button fexToggle value="underline"><u aria-hidden="true">U</u>Underline</button></div><p class="text-sm text-muted-foreground">Active: {{ formats().join(', ') || 'none' }}</p></div>
      </fex-card>
      <fex-card title="Variants and layout" description="Groups keep one visual identity across compact, outline, vertical, and disabled states.">
        <div class="grid gap-space-lg">
          <div class="flex items-center gap-space-lg"><span class="w-20 text-sm text-muted-foreground">Compact</span><div fexToggleGroup defaultValue="day" size="sm"><button fexToggle value="day">Day</button><button fexToggle value="week">Week</button><button fexToggle value="month">Month</button></div></div>
          <div class="flex items-start gap-space-lg"><span class="w-20 pt-1.5 text-sm text-muted-foreground">Vertical</span><div fexToggleGroup defaultValue="top" orientation="vertical" variant="outline"><button fexToggle value="top">Top</button><button fexToggle value="center">Center</button><button fexToggle value="bottom">Bottom</button></div></div>
          <div class="flex items-center gap-space-lg"><span class="w-20 text-sm text-muted-foreground">Disabled</span><div fexToggleGroup defaultValue="one" disabled><button fexToggle value="one">One</button><button fexToggle value="two">Two</button></div></div>
        </div>
      </fex-card>
    </div>
  </div>
</main>
