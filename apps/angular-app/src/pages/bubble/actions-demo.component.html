<fex-card title="Action and reaction positions" description="side controls the top or bottom edge; align controls the logical start or end position."><div class="mx-auto grid w-full max-w-2xl gap-8 py-8"><fex-message><div fexMessageAvatar><fex-avatar><fex-avatar-image src="/avatar-demo.svg" alt="Oliver"/><fex-avatar-fallback>O</fex-avatar-fallback></fex-avatar></div><div fexMessageBody><div fexMessageContent><fex-bubble><fex-bubble-content>Tests passed on the first try. All 142 of them.</fex-bubble-content><fex-bubble-actions side="top" align="end"><button fexBubbleAction>Pin</button><button fexBubbleAction>Copy</button></fex-bubble-actions><fex-bubble-reactions side="bottom" align="start"><button fexBubbleReaction aria-label="Helpful" [pressed]="liked()" (change)="liked.set($event)">🎉</button><button fexBubbleReaction aria-label="Celebrate">👏 <span fexBubbleReactionCount>2</span></button></fex-bubble-reactions></fex-bubble></div></div></fex-message><fex-message side="end"><div fexMessageBody><div fexMessageContent><fex-bubble variant="solid"><fex-bubble-content>Are you sure I can run this command?</fex-bubble-content><fex-bubble-reactions side="top" align="end"><button fexBubbleReaction aria-label="Watching">👀</button></fex-bubble-reactions><fex-bubble-actions side="bottom" align="end"><button fexBubbleAction>Yes, run it</button><button fexBubbleAction>Cancel</button></fex-bubble-actions></fex-bubble></div></div></fex-message><p class="text-center text-xs text-muted-foreground">Every part accepts class, so callers can replace the preset edge placement.</p></div></fex-card>
