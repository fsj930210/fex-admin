<fex-card title="Basic" description="Items, nested children, group, divider and disabled state.">
  <fex-menu-root [class]="rootClass"><fex-menu-list [class]="listClass">
    <button fexMenuItem value="dashboard" [selected]="selected() === 'dashboard'" [class]="itemClass" (click)="selected.set('dashboard')">Dashboard</button>
    <button fexMenuItem value="system" [class]="itemClass" (click)="basicOpen.set(!basicOpen())"><span class="flex-1 text-left">System</span><span>{{ basicOpen() ? '−' : '+' }}</span></button>
    @if (basicOpen()) {<div class="ml-5"><button fexMenuItem value="users" [selected]="selected() === 'users'" [class]="itemClass" (click)="selected.set('users')">Users</button><button fexMenuItem value="roles" [selected]="selected() === 'roles'" [class]="itemClass" (click)="selected.set('roles')">Roles</button><button fexMenuItem value="permissions" [disabled]="true" [class]="itemClass">Permissions</button></div>}
    <fex-menu-divider class="my-1 h-px bg-border" />
    <fex-menu-group><fex-menu-group-label class="px-2 py-1 text-xs font-medium text-muted-foreground">Workspace</fex-menu-group-label><button fexMenuItem value="settings" [class]="itemClass">Settings</button><button fexMenuItem value="billing" [class]="itemClass">Billing</button></fex-menu-group>
  </fex-menu-list></fex-menu-root>
</fex-card>
<fex-card title="Controlled" description="Expanded and selected state are owned by the caller.">
  <fex-menu-root [class]="rootClass"><fex-menu-list [class]="listClass"><button fexMenuItem value="system" [class]="itemClass" (click)="controlledOpen.set(!controlledOpen())"><span class="flex-1 text-left">System</span><span>{{ controlledOpen() ? 'open' : 'closed' }}</span></button>@if (controlledOpen()) {<div class="ml-5"><button fexMenuItem value="users" [selected]="controlledSelected() === 'users'" [class]="itemClass" (click)="controlledSelected.set('users')">Users</button><button fexMenuItem value="roles" [selected]="controlledSelected() === 'roles'" [class]="itemClass" (click)="controlledSelected.set('roles')">Roles</button></div>}<div class="px-2 pt-2 text-xs text-muted-foreground">expanded: {{ controlledOpen() }} · selected: {{ controlledSelected() }}</div></fex-menu-list></fex-menu-root>
</fex-card>
<fex-card title="Multiple Selection" description="The caller composes multiple selected items with the same primitive."><fex-menu-root [class]="rootClass"><fex-menu-list [class]="listClass">@for (value of multipleItems; track value) {<button fexMenuItem [value]="value" [selected]="multiple().has(value)" [class]="itemClass" (click)="toggle(value)"><span class="flex-1 capitalize">{{ value }}</span><span>{{ multiple().has(value) ? '✓' : '' }}</span></button>}</fex-menu-list></fex-menu-root></fex-card>
<fex-card title="Suffix" description="Items accept arbitrary right-side content."><fex-menu-root [class]="rootClass"><fex-menu-list [class]="listClass"><button fexMenuItem value="users" [class]="itemClass"><span class="flex-1">Users</span><span class="text-xs text-muted-foreground">24</span></button><button fexMenuItem value="comments" [class]="itemClass"><span class="flex-1">Comments</span><span class="text-xs text-muted-foreground">8</span></button><button fexMenuItem value="settings" [class]="itemClass"><span class="flex-1">Settings</span><span class="rounded-md bg-primary/10 px-1.5 py-0.5 text-xs text-primary">new</span></button></fex-menu-list></fex-menu-root></fex-card>
<fex-card title="Custom Item" description="The directive binds menu behavior to custom DOM."><fex-menu-root [class]="rootClass"><fex-menu-list [class]="listClass"><a fexMenuItem value="profile" href="#profile" [class]="itemClass"><span class="flex-1">Custom link item</span><span class="text-xs text-primary">open →</span></a><button fexMenuItem value="status" [class]="itemClass"><span class="mr-2 size-2 rounded-full bg-success"></span><span class="flex-1 text-left">Service status</span><span class="text-xs text-muted-foreground">Healthy</span></button></fex-menu-list></fex-menu-root></fex-card>
