<fex-card
  title="Form validation"
  description="Field owns validation text and ARIA relationships; InputNumber only renders invalid state."
>
  <form [fexForm]="form" class="grid max-w-xl gap-space-md">
    <ng-container
      [fexField]="form"
      name="quantity"
      [validators]="validators"
      #quantityField="field"
    >
      <fex-field-root
        [required]="true"
        [invalid]="invalid(quantityField.api)"
        [hasError]="invalid(quantityField.api)"
      >
        <label fexFieldLabel>Quantity <span fexFieldRequiredIndicator>*</span></label>
        <fex-input-number
          fexFieldControl
          [clearable]="true"
          [value]="quantityField.api.state.value"
          [min]="1"
          [invalid]="invalid(quantityField.api)"
          (change)="change(quantityField.api, $event)"
        />
        @if (invalid(quantityField.api)) {
          <div fexFieldError>
            @for (error of errors(quantityField.api); track error) {
              <div>{{ error }}</div>
            }
          </div>
        }
      </fex-field-root>
    </ng-container>
    <button fexButton type="submit" class="w-fit">Validate quantity</button>
  </form>
</fex-card>
