<fex-card
  title="Min and max"
  description="Actions are disabled when the value reaches its boundary."
>
  <div class="grid gap-space-lg md:grid-cols-2">
    <label class="grid gap-space-sm text-sm text-foreground">
      Minimum: 0
      <fex-input-number [defaultValue]="0" [min]="0" [max]="10" aria-label="Value at minimum" />
    </label>
    <label class="grid gap-space-sm text-sm text-foreground">
      Maximum: 10
      <fex-input-number [defaultValue]="10" [min]="0" [max]="10" aria-label="Value at maximum" />
    </label>
  </div>
</fex-card>
