<fex-card title="自定义颜色" description="color 和 bgColor 进入 core 模型，再由渲染部件消费。">
  <div class="flex flex-wrap gap-space-lg">
    <fex-qrcode-root value="https://fex.design/qrcode/blue" [size]="160" color="#075985" bgColor="#f0f9ff">
      <svg fexQrCodeSvg><rect fexQrCodeBackground /><path fexQrCodeModules /></svg>
    </fex-qrcode-root>
    <fex-qrcode-root value="https://fex.design/qrcode/green" [size]="160" color="#166534" bgColor="#f0fdf4">
      <svg fexQrCodeSvg><rect fexQrCodeBackground /><path fexQrCodeModules /></svg>
    </fex-qrcode-root>
  </div>
</fex-card>
