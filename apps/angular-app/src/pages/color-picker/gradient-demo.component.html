<fex-card title="渐变色" description="选择色标后编辑当前颜色；点击轨道新增色标，拖动色标调整位置，使用 OKLCH 插值。">
  <fex-gradient-picker-root #gradient [value]="value()" (change)="update($event)">
    <fex-popover>
      <button fexPopoverTrigger class="inline-flex h-9 w-fit max-w-full self-start items-center gap-2 rounded-md border border-border bg-background px-2 text-sm">
        <span class="size-6 shrink-0 rounded" [style.background]="css()"></span>
        <span class="truncate">{{ label() }}</span>
      </button>
      <fex-popover-content>
        <fex-color-picker-root [value]="selectedColor()" format="rgb" (change)="setSelectedColor($event.value)">
          <div class="grid w-80 gap-3">
            <div fexGradientPickerTrack>
              @for(stop of gradient.snapshot().value.stops;track stop.id){
                <button fexGradientPickerStop [id]="stop.id" [attr.aria-label]="(stop.position*100)+'% color stop'"></button>
              }
            </div>
            <fex-color-picker-panel-demo />
          </div>
        </fex-color-picker-root>
      </fex-popover-content>
    </fex-popover>
  </fex-gradient-picker-root>
</fex-card>
