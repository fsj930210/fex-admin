<fex-card
  title="Autosize"
  description="autoSize config: &#123; minRows: 1, maxRows: 4 &#125;. Content grows the field up to 4 rows, then the textarea scrolls."
>
  <fex-textarea-root class="max-w-xl" [autoSize]="autoSize" [defaultValue]="defaultValue">
    <textarea
      fexTextareaInput
      aria-label="Autosize textarea"
      placeholder="Type multiple lines to grow the input"
    ></textarea>
  </fex-textarea-root>
</fex-card>
