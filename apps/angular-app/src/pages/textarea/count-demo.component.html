<fex-card title="Count" description="Character count is derived by the caller and rendered wherever needed.">
  <div class="max-w-xl space-y-space-sm">
    <fex-textarea-root [value]="value" (change)="value = $event" [autoSize]="autoSize">
      <textarea fexTextareaInput aria-label="Textarea with count" [maxLength]="maxLength"></textarea>
    </fex-textarea-root>
    <p class="text-right text-sm text-muted-foreground">{{ value.length }} / {{ maxLength }}</p>
  </div>
</fex-card>
