<fex-card title="受控值" description="外部状态可以更新或清空所有输入段。"><div class="grid gap-space-md"><div fexInputOTPRoot [value]="value()" (valueChange)="change($event)"><div fexInputOTPGroup>@for(index of indexes;track index){<input fexInputOTPInput [index]="index" [maxLength]="2" class="w-14" [attr.aria-label]="'受控输入第 '+(index+1)+' 段'"/>}</div></div><p class="text-sm text-muted-foreground">分段值：{{ value() }}</p><button fexButton class="w-fit" variant="outline" (click)="clear()">清空</button></div></fex-card>
