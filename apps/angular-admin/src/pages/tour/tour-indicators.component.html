<div class="flex items-center gap-1" aria-label="引导进度">@for (index of indexes(); track index) {<button type="button" [attr.aria-label]="'第 ' + (index + 1) + ' 步'" [attr.aria-current]="index === root.snapshot().currentIndex ? 'step' : null" [class]="index === root.snapshot().currentIndex ? 'h-1.5 w-5 rounded-full bg-primary' : 'h-1.5 w-1.5 rounded-full bg-muted-foreground/40'" (click)="root.controller.goTo(index)"></button>}</div>
