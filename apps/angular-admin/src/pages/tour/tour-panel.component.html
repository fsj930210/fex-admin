<div class="relative w-72 space-y-3"><fex-tour-control action="close" aria-label="关闭" class="absolute right-0 top-0 z-10 size-7 p-0"><fex-close-icon /></fex-tour-control><div class="space-y-1 pr-8"><h3 class="text-sm font-semibold">{{ title }}</h3><p class="text-sm leading-5 text-muted-foreground">{{ description }}</p></div><div class="flex items-center gap-2"><span class="shrink-0 text-xs tabular-nums text-muted-foreground">{{ root.snapshot().currentIndex + 1 }} / {{ root.snapshot().total }}</span><div class="h-1.5 min-w-0 flex-1 overflow-hidden rounded-sm bg-muted-background" role="progressbar" aria-label="引导进度"><div class="h-full bg-primary transition-[width]" [style.width.%]="progress()"></div></div></div><ng-content /></div>
