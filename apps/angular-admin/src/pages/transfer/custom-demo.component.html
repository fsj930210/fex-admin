<fex-card
  title="Custom panel regions"
  description="Source and target headers, bodies and optional footers are configured independently while the panel structure remains built in."
>
  <fex-transfer [items]="members" [fieldNames]="fieldNames" [defaultTargetKeys]="['ada', 'susan']">
    <ng-template fexTransferActions let-api>
      <div class="flex flex-col items-center gap-2">
        <button fexButton variant="outline" size="sm" [disabled]="!api.canMoveToTarget" (click)="api.controller.moveToTarget()">
          Assign <fex-chevron-right-icon />
        </button>
        <button fexButton variant="outline" size="sm" [disabled]="!api.canMoveToSource" (click)="api.controller.moveToSource()">
          <fex-chevron-left-icon /> Remove
        </button>
      </div>
    </ng-template>
    <ng-template fexTransferItem let-item>
      <span>{{ item.name }} <span class="text-muted-foreground">· {{ item.department }}</span></span>
    </ng-template>
    <ng-template fexTransferPanel="source" region="header" let-api>
      <span class="font-medium">Candidate pool</span><fex-badge>{{ api.items.length }}</fex-badge>
    </ng-template>
    <ng-template fexTransferPanel="target" region="header" let-api>
      <span class="font-medium text-primary">Delivery team</span>
      <span class="ml-auto text-muted-foreground">{{ api.items.length }} members</span>
    </ng-template>
    <ng-template fexTransferPanel="source" region="footer">
      <span class="text-muted-foreground">Disabled members stay in their current panel.</span>
    </ng-template>
    <ng-template fexTransferPanel="target" region="footer">
      <span class="text-muted-foreground">Changes are applied when the form is submitted.</span>
    </ng-template>
  </fex-transfer>
</fex-card>
