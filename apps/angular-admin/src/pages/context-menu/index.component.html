<main class="min-h-screen bg-secondary-background px-page-padding py-space-xl">
  <div class="mx-auto w-full max-w-5xl space-y-space-xl">
    <header class="space-y-space-md">
      <a class="text-sm text-muted-foreground hover:text-foreground" routerLink="/">Back home</a>
      <div>
        <h1 class="text-2xl font-semibold text-foreground">ContextMenu</h1>
        <p class="mt-2 max-w-3xl text-sm leading-6 text-muted-foreground">
          Right-click primitive based on pointer virtual references. The trigger directive binds to existing elements,
          so tree rows, table headers and custom panels keep their DOM shape.
        </p>
      </div>
    </header>
    <div class="space-y-space-xl">
      <fex-card title="Basic right click" description="The trigger directive binds directly to the caller element; no wrapper is inserted.">
        <app-context-menu-basic-demo />
      </fex-card>
      <fex-card title="Tree node menu" description="Each tree row stays the actual trigger target, preserving indentation and row structure.">
        <app-context-menu-tree-demo />
      </fex-card>
      <fex-card title="Data table header and row menus" description="The same ContextMenu root can serve header cells and body rows with different payloads.">
        <app-context-menu-data-table-demo />
      </fex-card>
    </div>
  </div>
</main>
