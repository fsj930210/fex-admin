<fex-upload-demo-section
  title="多文件手动上传"
  description="一次选择多个文件，可逐个上传，也可以手动启动整个文件队列。"
  ><fex-upload-root [controller]="upload"
    ><div class="flex gap-space-sm">
      <button fexButton fexUploadTrigger variant="outline">选择多个文件</button
      ><button fexButton variant="outline" (click)="startAll()">全部上传</button>
    </div>
    <fex-demo-upload-list /></fex-upload-root
></fex-upload-demo-section>
