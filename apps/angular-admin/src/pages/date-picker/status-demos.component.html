<fex-card title="表单状态" description="DatePicker 和 RangePicker 接收外部表单状态，仅负责展示 error / warning 样式。">
  <div class="flex min-w-0 flex-wrap items-start gap-space-md">
    <fex-field-root [invalid]="true" [hasError]="true" [hasDescription]="true">
      <label fexFieldLabel>开始日期</label>
      <demo-date-picker status="error" placeholder="请选择日期" />
      <p fexFieldDescription>状态来自 Form / Field，不由 DatePicker 自己校验。</p>
      <div fexFieldError>请选择开始日期</div>
    </fex-field-root>

    <fex-field-root [hasDescription]="true">
      <label fexFieldLabel>审批范围</label>
      <demo-range-picker status="warning" />
      <p fexFieldDescription>warning 只改变视觉状态，提交仍交给外层 Form。</p>
    </fex-field-root>
  </div>
</fex-card>
