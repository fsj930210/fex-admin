<fex-card title="自定义渲染类型" description="同一个 Root 模型可以选择 SVG 或 Canvas 渲染面。">
  <div class="flex flex-wrap gap-space-lg">
    <fex-qrcode-root value="https://fex.design/qrcode/svg" [size]="160">
      <svg fexQrCodeSvg aria-label="SVG QR code">
        <rect fexQrCodeBackground />
        <path fexQrCodeModules />
      </svg>
    </fex-qrcode-root>
    <fex-qrcode-root value="https://fex.design/qrcode/canvas" [size]="160">
      <canvas fexQrCodeCanvas aria-label="Canvas QR code"></canvas>
    </fex-qrcode-root>
  </div>
</fex-card>
