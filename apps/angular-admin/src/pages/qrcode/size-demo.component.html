<fex-card title="自定义尺寸" description="通过 Root 的 size 控制二维码输出尺寸。">
  <div class="flex flex-wrap items-end gap-space-lg">
    @for (size of sizes; track size) {
    <fex-qrcode-root [value]="'https://fex.design/qrcode/size/' + size" [size]="size">
      <svg fexQrCodeSvg><rect fexQrCodeBackground /><path fexQrCodeModules /></svg>
    </fex-qrcode-root>
    }
  </div>
</fex-card>
