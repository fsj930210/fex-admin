<fex-card title="Overlay" description="Overlay 不参与二维码生成，可组合加载、失效和自定义操作状态。">
  <div class="flex flex-wrap items-center gap-space-md">
    <fex-qrcode-root value="https://fex.design/overlay" [size]="176">
      <svg fexQrCodeSvg>
        <rect fexQrCodeBackground />
        <path fexQrCodeModules />
      </svg>
      @if (expired()) {
      <fex-qrcode-overlay>
        <button fexButton size="sm" (click)="expired.set(false)">Refresh</button>
      </fex-qrcode-overlay>
      }
    </fex-qrcode-root>
    <button fexButton variant="outline" (click)="expired.update((value) => !value)">
      Toggle overlay
    </button>
  </div>
</fex-card>
