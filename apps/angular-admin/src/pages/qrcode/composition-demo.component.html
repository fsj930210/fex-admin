<fex-card title="Composition" description="Modules 和 Center 可以独立组合，中心内容由调用方决定。">
  <fex-qrcode-root
    value="https://fex.design/composition"
    [size]="176"
    errorLevel="H"
    class="bg-muted-background"
  >
    <svg fexQrCodeSvg>
      <rect fexQrCodeBackground />
      <path fexQrCodeModules [centerSize]="40" />
      <svg fexQrCodeCenter [size]="40" aria-label="Fex Design">
        <rect width="100" height="100" rx="20" class="fill-background" />
        <text
          x="50"
          y="52"
          text-anchor="middle"
          dominant-baseline="middle"
          font-size="30"
          class="fill-primary font-semibold"
        >
          FX
        </text>
      </svg>
    </svg>
  </fex-qrcode-root>
</fex-card>
