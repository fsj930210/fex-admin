<fex-card title="跨段粘贴" description="可从任意输入框开始粘贴，内容会按后续分段容量依次分配。"><div class="grid gap-space-md"><div fexInputOTPRoot (valueChange)="change($event)"><div fexInputOTPGroup>@for(index of indexes;track index){<input fexInputOTPInput [index]="index" [maxLength]="3" class="w-16" [attr.aria-label]="'第 '+(index+1)+' 段'"/>}</div></div><p class="text-sm text-muted-foreground">分段值：{{ value() }}</p></div></fex-card>
