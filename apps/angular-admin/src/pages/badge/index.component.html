<main class="min-h-screen bg-secondary-background px-page-padding py-space-xl">
  <div class="mx-auto w-full max-w-5xl space-y-space-xl">
    <header class="space-y-space-md">
      <a class="text-sm text-muted-foreground hover:text-foreground" routerLink="/">Back home</a>
      <h1 class="text-2xl font-semibold text-foreground">Badge</h1>
      <p class="max-w-2xl text-sm leading-6 text-muted-foreground">
        Use badges for compact status, category, and count labels.
      </p>
    </header>
    <div class="grid gap-space-xl"><fex-card title="Variants" description="Badge visual styles."
      ><div class="flex min-w-0 flex-wrap items-center gap-space-md">
        @for (variant of variants; track variant) {
          <fex-badge [variant]="variant">{{ variant }}</fex-badge>
        }
      </div></fex-card
    ><fex-card title="Overflow" description="Keeps the collection compact without changing its values."><fex-badge-overflow [maxCount]="3">@for (item of overflowItems; track item) { <fex-badge variant="secondary">{{ item }}</fex-badge> }</fex-badge-overflow></fex-card></div>
  </div>
</main>
